name: Release package

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Release verification
    uses: ./.github/workflows/verify.yml

  publish:
    name: Publish the verified archive
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Verify tag matches the verified extension version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXTENSION_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert.equal(process.env.RELEASE_TAG, `v${process.env.EXTENSION_VERSION}`, 'Update the manifest version before tagging a release');
          NODE
      - name: Download the archive produced by verification
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: color-picker-extension
          path: release-artifacts
      - name: Verify archive checksum
        working-directory: release-artifacts
        run: sha256sum --check color-picker-extension.zip.sha256
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-artifacts/color-picker-extension.zip release-artifacts/color-picker-extension.zip.sha256 --verify-tag --generate-notes
